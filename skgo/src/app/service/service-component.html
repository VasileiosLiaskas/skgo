<div class="add-service">
  <h2>Συνεργείο</h2>
  <form>
    <div class="form-group">
      <label for="car-number">Car Number</label>
      <select id="car-number">
        <option value="7283">7283</option>
        <option value="7232">7232</option>
        <option value="4073">4073</option>
      </select>
    </div>
    <div class="form-group">
      <label for="execution-date">Execution Date</label>
      <input type="date" id="execution-date">
    </div>
    <div class="form-group">
      <label for="status">Status</label>
      <select id="status">
        <option value="service">Service</option>
        <option value="λάστιχα τσεκ">Λάστιχα Τσεκ</option>
        <option value="αμορτισέρ">Αμορτισέρ</option>
      </select>
    </div>
    <div class="form-group">
      <label for="amount">Amount</label>
      <input type="number" id="amount" min="0">
    </div>
    <div class="form-group">
      <label for="balance">Balance</label>
      <input type="number" id="balance" min="0">
    </div>
    <button type="submit">Add Service</button>
  </form>
</div>
