<div class="sidebar">
  <ul>
    <li class="play-regular"
        *ngFor="let menuItem of menuItems"
        [class.active]="menuItem.label === activeSection"
        (click)="setActiveSection(menuItem)">

      <i [class]="menuItem.icon" style="margin-right: 10px;"></i>
      <a [routerLink]="menuItem.route">{{ menuItem.label }}</a>
    </li>
  </ul>
</div>
